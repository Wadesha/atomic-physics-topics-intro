<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交互 2 · 网格解薛定谔方程</title>
<link rel="stylesheet" href="common.css">
<style>
  body{max-width:1180px;margin:0 auto;padding:22px 18px 64px;}
  .topbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:6px;font-size:14px;}
  .topbar a{color:var(--acc,#38bdf8);text-decoration:none;}
  .topbar a:hover{text-decoration:underline;}
  .pagetitle{font-size:21px;margin:8px 0 2px;}
  .sub{color:var(--mut,#9aa4b2);font-size:14px;margin:0 0 14px;}
</style>
</head>
<body>
<header class="topbar">
  <a href="index.html">← 子站总目录</a>
  <a href="../index.html">↩ 完整导览主页</a>
</header>
<h1 class="pagetitle">交互 2：网格解薛定谔方程 </h1>
<p class="sub">同一套 Jacobi 在浏览器里跑</p>
<main>

<div class="demo">
    <h4>交互 2：网格解薛定谔方程<span class="badge">同一套 Jacobi 在浏览器里跑</span></h4>
    <div class="ctl">
      <label>势能 <select id="dPot">
        <option value="ho">谐振子 V=x²/2</option>
        <option value="morse">Morse V=De(1−e^(−ax))²</option>
        <option value="box">无限深势阱</option>
        <option value="dw">双阱 V=(x²−4)²/8</option>
      </select></label>
      <label>网格点数 N <input id="dN" type="range" min="20" max="140" step="10" value="80"><span class="val" id="dNv">80</span></label>
      <label><input id="dWf" type="checkbox" checked> 画波函数</label>
      <button id="dRun">重新计算</button>
    </div>
    <canvas id="cDvr" width="1200" height="460"></canvas>
    <div class="out" id="oDvr">点「重新计算」开始…</div>
  </div>
</main>
<footer class="footer">本页为原子物理 / 量子光学主题自底向上导览的独立交互演示（子站）。数值结论以程序实际输出为准。</footer>
<script src="common.js"></script>
<script>
(function(){
  var sN=document.getElementById('dN'), vN=document.getElementById('dNv');
  var sel=document.getElementById('dPot'), cbW=document.getElementById('dWf');
  var out=document.getElementById('oDvr');
  var POT={
    ho   :{f:function(x){return 0.5*x*x;}, a:-8, b:8,  name:'谐振子 V=x²/2',
           ana:function(n){return n+0.5;}, anaTxt:'n+½'},
    morse:{f:function(x){return 12*Math.pow(1-Math.exp(-0.4*x),2);}, a:-4, b:22, name:'Morse De=12,a=0.4',
           ana:function(n){var we=0.4*Math.sqrt(24),wx=0.08;return we*(n+0.5)-wx*(n+0.5)*(n+0.5);},
           anaTxt:'ωₑ(n+½)−ωₑxₑ(n+½)²'},
    box  :{f:function(x){return 0;}, a:0, b:Math.PI, name:'无限深势阱 [0,π]',
           ana:function(n){return 0.5*(n+1)*(n+1);}, anaTxt:'(n+1)²/2'},
    dw   :{f:function(x){return Math.pow(x*x-4,2)/8;}, a:-4.5, b:4.5, name:'双阱 V=(x²−4)²/8',
           ana:null, anaTxt:'—'}
  };
  function run(){
    var N=+sN.value; vN.textContent=N;
    var p=POT[sel.value], h=(p.b-p.a)/(N+1), xs=[], i;
    for(i=0;i<N;i++) xs.push(p.a+(i+1)*h);
    var T=0.5/(h*h), H=[];
    for(i=0;i<N;i++){var row=new Array(N).fill(0);row[i]=2*T+p.f(xs[i]);
      if(i>0)row[i-1]=-T; if(i<N-1)row[i+1]=-T; H.push(row);}
    var t0=performance.now();
    var r=eigen(H,N);
    var ms=performance.now()-t0;
    draw(xs,p,r,N,h);
    var s='势能：'+p.name+'    网格 N='+N+'  步长 h='+h.toFixed(4)+
          '    Jacobi 扫描 '+r.sweeps+' 轮，耗时 <i>'+ms.toFixed(0)+' ms</i>\n';
    s+=' n |   数值 E_n   |  解析 '+p.anaTxt+'  |   相对误差   | 相邻间隔\n';
    for(var n=0;n<6;n++){
      var a=p.ana?p.ana(n):null;
      var gap=n>0?(r.val[n]-r.val[n-1]).toFixed(4):'   —  ';
      s+=' '+n+' | '+r.val[n].toFixed(6).padStart(11)+' | '+
         (a!==null?a.toFixed(6).padStart(13):'            —')+' | '+
         (a!==null?((Math.abs(r.val[n]-a)/Math.abs(a)*100).toFixed(3)+'%').padStart(11):'          —')+
         ' | '+gap+'\n';
    }
    if(sel.value==='morse') s+='间隔逐级递减，差值恒为 2ωₑxₑ=0.16 → 非谐性；这就是 ONDIA 里 X(I,J) 的来源。';
    else if(sel.value==='ho') s+='间隔恒为 1（=ℏω）→ 完美谐性。加大 N 看基态如何逼近 0.5。';
    else if(sel.value==='dw') s+='注意最低两个能级几乎简并（对称/反对称组合）——这就是隧穿分裂，Δ 越小势垒越高。';
    else s+='无限深势阱：E ∝ (n+1)²，间隔越来越大，与谐振子恰好相反。';
    out.innerHTML=s;
  }
  function draw(xs,p,r,N,h){
    var o=ctxOf('cDvr'), g=o.g, cw=o.c.width, ch=o.c.height;
    var L=70,Rr=cw-30,T=24,B=ch-40;
    var vmax=0; xs.forEach(function(x){vmax=Math.max(vmax,p.f(x));});
    var emax=Math.max(r.val[5]*1.45, 1);
    emax=Math.min(emax, vmax>0?vmax*1.05:emax);
    if(p===POT.box) emax=r.val[5]*1.2;
    var X=function(x){return L+(x-p.a)/(p.b-p.a)*(Rr-L);};
    var Y=function(e){return B-e/emax*(B-T);};
    axis(g,L,T,Rr,B);
    g.strokeStyle='#1b212a';g.lineWidth=1;
    for(var k=1;k<=5;k++){var yy=T+(B-T)*k/6;g.beginPath();g.moveTo(L,yy);g.lineTo(Rr,yy);g.stroke();}
    /* 势能曲线 */
    g.strokeStyle='#64748b';g.lineWidth=2;g.beginPath();
    for(var i=0;i<=300;i++){var x=p.a+(p.b-p.a)*i/300, yv=Y(Math.min(p.f(x),emax*1.2));
      i?g.lineTo(X(x),yv):g.moveTo(X(x),yv);} g.stroke();
    /* 能级 + 波函数 */
    var cols=['#7dd3fc','#86efac','#fca5a5','#fde68a','#c4b5fd','#f9a8d4'];
    for(var n=0;n<6;n++){
      var E=r.val[n]; if(E>emax) break;
      g.strokeStyle=cols[n];g.lineWidth=1.3;g.globalAlpha=.55;
      g.beginPath();g.moveTo(L,Y(E));g.lineTo(Rr,Y(E));g.stroke();g.globalAlpha=1;
      txt(g,'E'+n+'='+E.toFixed(4),Rr-4,Y(E)-5,cols[n],11.5,'right');
      if(cbW.checked){
        var v=r.vec[n], mx=0; v.forEach(function(a){mx=Math.max(mx,Math.abs(a));});
        var amp=(B-T)*0.085/ (mx||1);
        g.strokeStyle=cols[n];g.lineWidth=2;g.beginPath();
        for(var j=0;j<N;j++){var px=X(xs[j]),py=Y(E)-v[j]*amp;j?g.lineTo(px,py):g.moveTo(px,py);}
        g.stroke();
      }
    }
    txt(g,'E / 自然单位 (ℏ=m=1)',L-8,T-8,'#9aa4b2',12,'right');
    txt(g,'x',(L+Rr)/2,ch-10,'#9aa4b2',12,'center');
    txt(g,'灰线=势能   彩线=波函数（画在各自能级上）',Rr,T+4,'#5f6b7a',11.5,'right');
  }
  sN.oninput=run; sel.onchange=run; cbW.onchange=run;
  document.getElementById('dRun').onclick=run;
  run();
})();
</script>
</body>
</html>
