<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交互 17 · 伪随机分子带（合成）</title>
<link rel="stylesheet" href="common.css">
<style>
  body{max-width:1180px;margin:0 auto;padding:22px 18px 64px;}
  .topbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:6px;font-size:14px;}
  .topbar a{color:var(--acc,#38bdf8);text-decoration:none;}
  .topbar a:hover{text-decoration:underline;}
  .pagetitle{font-size:21px;margin:8px 0 2px;}
  .sub{color:var(--mut,#9aa4b2);font-size:14px;margin:0 0 14px;}
</style>
</head>
<body>
<header class="topbar">
  <a href="index.html">← 子站总目录</a>
  <a href="../index.html">↩ 完整导览主页</a>
</header>
<h1 class="pagetitle">交互 17：伪随机分子带（合成） <span class="badge sim" style="background:#7f1d1d;color:#fecaca;border-color:#991b1b">模拟展示 · 非实验数据</span></h1>
<p class="sub">JS 实时计算 · 非查表</p>
<main>
<p class="simwarn">⚠ 本演示为<b>程序生成的合成谱</b>，不是任何真实分子的实验数据，仅用于展示"一条分子吸收谱长什么样"。其谱线位置/强度由随机数决定，不可用于任何科研结论。</p>
<div class="demo">
    <h4>交互 17：伪随机分子带（合成）<span class="badge sim" style="background:#7f1d1d;color:#fecaca;border-color:#991b1b">模拟展示 · 非实验数据</span></h4>
    <div class="ctl">
      <label>谱线条数 <input id="syN" type="range" min="20" max="120" step="10" value="60"><span class="val" id="syNv">60</span></label>
      <label>多普勒宽 a_D <input id="syD" type="range" min="0.5" max="3" step="0.1" value="1.2"><span class="val" id="syDv">1.2</span></label>
    </div>
    <canvas id="cSyn" width="1200" height="400"></canvas>
    <div class="out" id="oSyn"></div>
  </div>
</main>
<footer class="footer">本页为原子物理 / 量子光学主题自底向上导览的独立交互演示（子站）。数值结论以程序实际输出为准。</footer>
<script src="common.js"></script>
<script>
(function(){
  var sN=document.getElementById('syN'), sD=document.getElementById('syD');
  var vN=document.getElementById('syNv'), vD=document.getElementById('syDv');
  var out=document.getElementById('oSyn');
  function draw(){
    var n=+sN.value, aD=+sD.value; vN.textContent=n; vD.textContent=aD.toFixed(1);
    var seed=987654321;function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}
    var lines=[];for(var i=0;i<n;i++)lines.push({pos:rnd(),str:0.3+rnd()*1.2});
    lines.sort(function(a,b){return a.pos-b.pos;});
    var w=aD*0.012;
    var o=ctxOf('cSyn'),c=o.c,g=o.g,W=c.width,H=c.height;
    var x0=70,x1=W-40,y0=H-40,y1=40; axis(g,x0,y0,x1,y1);
    g.strokeStyle='#86efac';g.lineWidth=1.4;g.beginPath();
    for(var i=0;i<=700;i++){var x=i/700,y=0;
      for(var k=0;k<lines.length;k++){var dxp=x-lines[k].pos;y+=lines[k].str*Math.exp(-dxp*dxp/(2*w*w));}
      var px=x0+x*(x1-x0),py=y0-Math.min(y,1.4)/1.4*(y0-y1);if(i===0)g.moveTo(px,py);else g.lineTo(px,py);}g.stroke();
    txt(g,'合成吸收（任意单位，非实验数据）',(x0+x1)/2,y1-8,'#9aa4b2',12,'center');
    out.innerHTML='⚠ 合成谱：'+n+' 条随机线（位置/强度由伪随机生成）叠加成包络，模仿真实分子带的"密集成带"外观。\n'+
      '没有可校核的真值 —— 与 9.7–9.16 "能对齐真实常数" 的演示有本质区别。';
  }
  sN.oninput=draw;sD.oninput=draw;draw();
})();
</script>
</body>
</html>
