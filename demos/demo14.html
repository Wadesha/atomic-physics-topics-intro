<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交互 14 · 2D DVR 本征能级 vs 解析 (n_x+n_y+1)</title>
<link rel="stylesheet" href="common.css">
<style>
  body{max-width:1180px;margin:0 auto;padding:22px 18px 64px;}
  .topbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:6px;font-size:14px;}
  .topbar a{color:var(--acc,#38bdf8);text-decoration:none;}
  .topbar a:hover{text-decoration:underline;}
  .pagetitle{font-size:21px;margin:8px 0 2px;}
  .sub{color:var(--mut,#9aa4b2);font-size:14px;margin:0 0 14px;}
</style>
</head>
<body>
<header class="topbar">
  <a href="index.html">← 子站总目录</a>
  <a href="../index.html">↩ 完整导览主页</a>
</header>
<h1 class="pagetitle">交互 14：2D DVR 本征能级 vs 解析 (n_x+n_y+1) </h1>
<p class="sub">实时 N</p>
<main>

<div class="demo">
    <h4>交互 14：2D DVR 本征能级 vs 解析 (n_x+n_y+1)<span class="badge">实时 N</span></h4>
    <div class="ctl">
      <label>每维网格 N <input id="d2N" type="range" min="8" max="14" step="2" value="12"><span class="val" id="d2Nv">12</span></label>
    </div>
    <canvas id="c2d" width="1200" height="400"></canvas>
    <div class="out" id="o2d"></div>
  </div>
</main>
<footer class="footer">本页为原子物理 / 量子光学主题自底向上导览的独立交互演示（子站）。数值结论以程序实际输出为准。</footer>
<script src="common.js"></script>
<script>
(function(){
  var sN=document.getElementById('d2N'), vN=document.getElementById('d2Nv');
  var out=document.getElementById('o2d');
  function build1D(N){var dx=8/(N-1),H1=[];for(var i=0;i<N;i++){var row=[],x=-4+i*dx;
    for(var j=0;j<N;j++){var t;if(i===j)t=Math.PI*Math.PI/(6*dx*dx);else t=(((i-j)%2===0)?1:-1)/((i-j)*(i-j)*dx*dx);
      row.push(t+(i===j?0.5*x*x:0));}H1.push(row);}return H1;}
  function draw(){
    var N=+sN.value; vN.textContent=N;
    var H1=build1D(N), M=N*N, H2=[];
    for(var a=0;a<M;a++){H2.push(new Array(M).fill(0));}
    for(var i1=0;i1<N;i1++)for(var i2=0;i2<N;i2++){var r=i1*N+i2;
      for(var j1=0;j1<N;j1++)for(var j2=0;j2<N;j2++){var cl=j1*N+j2;
        H2[r][cl]=(i2===j2?H1[i1][j1]:0)+(i1===j1?H1[i2][j2]:0);}}
    var sol=eigen(H2,M), ev=sol.val.slice(0,16);
    var ana=[],val=1,cnt=1;while(ana.length<16){for(var d=0;d<cnt&&ana.length<16;d++)ana.push(val);val++;cnt++;}
    var o=ctxOf('c2d'),c=o.c,g=o.g,W=c.width,H=c.height;
    var x0=70,x1=W-40,y0=H-40,y1=40; axis(g,x0,y0,x1,y1);
    var emax=7;
    g.fillStyle='#7dd3fc';
    for(var i=0;i<ev.length;i++){var px=x0+(i+0.5)/16*(x1-x0),py=y0-(ev[i]/emax)*(y0-y1);
      g.beginPath();g.arc(px,py,4,0,7);g.fill();}
    g.strokeStyle='#fca5a5';g.setLineDash([6,4]);g.lineWidth=1.5;
    var cur=1,j=0;
    for(var i=0;i<ev.length;i++){if(i>0&&ana[i]!==ana[i-1])cur++;var px=x0+(i+0.5)/16*(x1-x0),py=y0-(ana[i]/emax)*(y0-y1);
      g.beginPath();g.moveTo(x0,py);g.lineTo(x1,py);g.stroke();}
    g.setLineDash([]);
    txt(g,'2D DVR（蓝点） vs 解析 E=(nₓ+n_y+1)（红虚线）',x0,y1-10,'#9aa4b2',12,'left');
    var maxdev=0;for(var i=0;i<ev.length;i++)maxdev=Math.max(maxdev,Math.abs(ev[i]-ana[i]));
    out.innerHTML='最低 16 个 2D DVR 本征值 vs 解析 2D 谐振子能级（含简并）。\n'+
      '最大偏差 = <b>'+maxdev.toFixed(4)+'</b>（原子单位 ℏω=1）。网格 N='+N+' 时即为精确解。';
  }
  sN.oninput=draw;draw();
})();
</script>
</body>
</html>
